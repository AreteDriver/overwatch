[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overwatch"
version = "0.1.0"
description = "Tactical ISR dashboard — unifies YOLO detections, OSINT intel feeds, and drone telemetry into a single operational picture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AreteDriver"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.41.0",
    "folium>=0.18.0",
    "streamlit-folium>=0.23.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["overwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: full write-path integration tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
