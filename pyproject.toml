[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overwatch"
version = "0.3.0"
description = "Tactical ISR dashboard — unifies YOLO detections, OSINT intel feeds, and drone telemetry into a single operational picture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AreteDriver"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.41.0",
    "folium>=0.18.0",
    "streamlit-folium>=0.23.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "alembic>=1.13",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["overwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: full write-path integration tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true

# Ratchet: per-module error ceilings — run `mypy --no-error-summary overwatch`
# and update these counts as you fix type errors.
# Modules not listed here use the default (no ceiling).
# To add a new module, run mypy and append the count.
[[tool.mypy.overrides]]
module = [
    "overwatch.analysis.alerts",
    "overwatch.analysis.briefing",
    "overwatch.analysis.entities",
    "overwatch.analysis.geofence",
    "overwatch.analysis.mesh_health",
    "overwatch.analysis.ollama_briefing",
    "overwatch.analysis.replay",
    "overwatch.analysis.rules",
    "overwatch.api.routes",
    "overwatch.app",
    "overwatch.database",
    "overwatch.events",
    "overwatch.ingest.detections",
    "overwatch.ingest.intel",
    "overwatch.ingest.telemetry",
    "overwatch.ingest.thewire_adapter",
    "overwatch.models",
    "overwatch.retention",
    "overwatch.security",
]
disallow_untyped_defs = false
